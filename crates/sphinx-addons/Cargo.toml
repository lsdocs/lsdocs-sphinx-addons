[package]
name = "lsdocs-sphinx-addons"
description = "First-party plugin for the directives and roles Sphinx adds to docutils, in reStructuredText and Markdown alike."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

[lints]
workspace = true

[dependencies]
lsdocs-plugin-sdk.workspace = true
lsdocs-rst.workspace = true
serde.workspace = true
serde_json.workspace = true

[dev-dependencies]
lsdocs-parser-markdown.workspace = true
lsdocs-parser-rst.workspace = true
tokio = { workspace = true, features = ["macros", "rt"] }
